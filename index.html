<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Shivam Furniture</title>
  <style>
    :root {
      --bg: #000000; --card: #1C1C1E; --sep: #38383A;
      --blue: #0A84FF; --green: #30D158; --red: #FF453A;
      --text: #FFFFFF; --text-sec: #8E8E93;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; padding-bottom: 60px; }
    
    /* Nav Bar */
    .app-header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(28, 28, 30, 0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 0.5px solid var(--sep);
      padding: 14px 20px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px;
    }
    .app-title h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.4px; color: var(--text); text-align: center; }
    .app-title p { font-size: 13px; color: var(--text-sec); text-align: center; margin-top: 2px; }

    .container { max-width: 800px; margin: 0 auto; }

    /* iOS Groups */
    .ios-section-header { font-size: 13px; text-transform: uppercase; color: var(--text-sec); margin: 28px 20px 8px; letter-spacing: -0.1px; }
    .ios-section-footer { font-size: 13px; color: var(--text-sec); margin: 8px 20px 20px; line-height: 1.4; }
    .ios-group { background: var(--card); border-radius: 10px; margin: 0 16px; overflow: hidden; }
    .ios-cell { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; position: relative; min-height: 48px; }
    .ios-cell:not(:last-child)::after { content: ''; position: absolute; bottom: 0; left: 16px; right: 0; height: 0.5px; background-color: var(--sep); }
    .ios-cell.col { flex-direction: column; align-items: flex-start; }
    
    /* Inputs */
    .ios-label { font-size: 17px; color: var(--text); flex-shrink: 0; }
    .ios-input, .ios-textarea { background: transparent; border: none; color: var(--text); font-size: 17px; text-align: right; flex: 1; min-width: 0; outline: none; padding-left: 12px; }
    .ios-input::placeholder, .ios-textarea::placeholder { color: var(--text-sec); }
    .ios-input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.5; cursor: pointer; }
    .ios-textarea { text-align: left; resize: vertical; min-height: 44px; margin-top: 6px; padding-left: 0; width: 100%; max-width: 100%; }

    /* Switches */
    .switch-wrap { position: relative; width: 51px; height: 31px; border-radius: 31px; background: #39393D; transition: background 0.25s; cursor: pointer; }
    .switch-wrap input { opacity: 0; width: 0; height: 0; position: absolute; }
    .switch-knob { position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; background: #FFFFFF; border-radius: 50%; box-shadow: 0 3px 8px rgba(0,0,0,0.15); transition: transform 0.25s; pointer-events: none; }
    .switch-wrap input:checked + .switch-knob { transform: translateX(20px); }
    .switch-wrap.on-bg { background: var(--green); }

    /* Segmented Control */
    .segmented-control { display: flex; background: #1C1C1E; border-radius: 8px; padding: 2px; width: 100%; max-width: 300px; border: 1px solid var(--sep); }
    .segment-btn { flex: 1; padding: 6px 0; font-size: 13px; font-weight: 600; text-align: center; color: var(--text); border-radius: 6px; cursor: pointer; transition: background 0.2s; border: none; background: transparent; }
    .segment-btn.active { background: #636366; box-shadow: 0 3px 8px rgba(0,0,0,0.12); }

    /* Buttons */
    .btn { display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 12px; font-size: 17px; font-weight: 600; color: #FFFFFF; border: none; cursor: pointer; transition: transform 0.15s, opacity 0.15s; width: 100%; margin-top: 16px; box-sizing: border-box; }
    .btn:active { transform: scale(0.97); opacity: 0.9; }
    .btn-primary { background: var(--blue); }
    .btn-success { background: var(--green); }
    .btn-action { background: #2C2C2E; color: var(--blue); margin: 0 16px; width: calc(100% - 32px); margin-top: 24px; }
    .btn-clear { background: #2C2C2E; color: var(--red); margin: 0 16px 32px; width: calc(100% - 32px); }

    /* Delete Circle Button */
    .btn-circular-delete { width: 24px; height: 24px; border-radius: 50%; background: var(--red); color: white; border: none; font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; margin: 0 auto; }

    /* Items Table UI */
    .items-table-ui { width: 100%; border-collapse: collapse; }
    .items-table-ui th { font-size: 11px; text-transform: uppercase; color: var(--text-sec); padding: 8px; text-align: center; font-weight: 500; border-bottom: 0.5px solid var(--sep); }
    .items-table-ui td { padding: 8px; border-bottom: 0.5px solid var(--sep); vertical-align: middle; }
    .ios-num { width: 100%; background: transparent; border: none; color: var(--text); text-align: center; font-size: 15px; outline: none; }
    .ios-text { width: 100%; background: transparent; border: none; color: var(--text); font-size: 15px; outline: none; box-sizing: border-box; }
    .items-table-ui .row-total { font-size: 15px; color: var(--text-sec); }

    #preview-wrap { background: #FFFFFF; margin: 24px 16px; border-radius: 12px; overflow: hidden; display: none; }
    #preview-wrap.visible { display: block; }
    .a4-page { width: 210mm; min-height: 297mm; margin: 0 auto; position: relative; zoom: 0.8; transform-origin: top center; }
    @media(max-width: 600px) { .a4-page { zoom: 0.45; } }

    /* ════════════════════════════════════════
       BILL STYLES  (applies inside .a4-page)
    ════════════════════════════════════════ */
    #bill { font-family: Arial, sans-serif; color: #111; background: #fff; font-size: 9.5pt; padding: 12mm 14mm 14mm; min-height: 297mm; display: flex; flex-direction: column; }
    #bill .invoice-title { text-align: center; font-size: 10pt; font-weight: 700; text-decoration: underline; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    #bill .bill-header { text-align: center; border: 2px solid #000; padding: 10px 10px 8px; }
    #bill .shop-name { font-size: 22pt; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; font-family: 'Arial Black', Arial, sans-serif; line-height: 1.1; }
    #bill .shop-addr { font-size: 8.5pt; color: #333; margin: 3px 0; }
    #bill .shop-phone { font-size: 8.5pt; margin: 2px 0; }
    #bill .shop-gstin { font-size: 9pt; font-weight: 700; margin-top: 5px; }
    #bill .meta-row { display: flex; justify-content: flex-end; align-items: center; padding: 5px 10px; border-left: 2px solid #000; border-right: 2px solid #000; border-bottom: 1px solid #888; font-size: 8.5pt; }
    #bill .composite-notice { text-align: center; border-left: 2px solid #000; border-right: 2px solid #000; border-bottom: 1px solid #888; padding: 5px 10px; font-size: 8.5pt; }
    #bill .buyer-box { border-left: 2px solid #000; border-right: 2px solid #000; border-bottom: 1px solid #888; padding: 8px 10px; display: flex; justify-content: space-between; align-items: flex-start; }
    #bill .buyer-left { font-size: 8.5pt; line-height: 1.65; }
    #bill .buyer-label { font-weight: 700; font-size: 8.5pt; }
    #bill .buyer-name { font-weight: 700; }
    #bill .buyer-date { font-size: 8.5pt; white-space: nowrap; }
    #bill table.items { width: 100%; border-collapse: collapse; border-left: 2px solid #000; border-right: 2px solid #000; }
    #bill table.items th { border: 1px solid #000; padding: 6px 8px; font-size: 8pt; font-weight: 700; text-align: center; text-transform: uppercase; background: #f0f0f0; }
    #bill table.items td { border: 1px solid #888; padding: 5.5px 8px; font-size: 8.5pt; text-align: center; }
    #bill table.items td.item-name { text-align: left; }
    #bill .summary-row { display: flex; justify-content: space-between; align-items: center; border-left: 2px solid #000; border-right: 2px solid #000; border-bottom: 1px solid #aaa; padding: 6px 10px; font-size: 8.5pt; }
    #bill .summary-row.bold-row { font-weight: 700; font-size: 9pt; border-bottom: 1px solid #555; }
    #bill .summary-row.total-row { font-weight: 900; font-size: 10pt; border-bottom: 2px solid #000; border-top: 1px solid #000; background: #f4f4f4; }
    #bill .summary-row .amt { font-weight: 700; }
    #bill .summary-row.total-row .amt { font-weight: 900; }
    #bill .add-block { font-size: 8.5pt; }
    #bill .add-block .add-head { font-weight: 700; font-size: 8.5pt; }
    #bill .words-section { padding: 10px 10px 6px; border-left: 2px solid #000; border-right: 2px solid #000; border-bottom: 1px solid #ccc; font-size: 8.5pt; }
    #bill .words-lbl { font-size: 8pt; color: #555; }
    #bill .words-val { font-weight: 700; font-size: 9pt; margin-top: 3px; }
    #bill .bank-section { padding: 8px 10px 10px; font-size: 8.5pt; }
    #bill .bank-title { font-weight: 700; font-size: 8.5pt; margin-bottom: 5px; }
    #bill .bank-grid { display: grid; grid-template-columns: 100px 1fr; gap: 2px 0; font-size: 8pt; }
    #bill .bank-key { color: #444; }
    #bill .bill-body { flex: 1; }
    #bill .sign-section { margin-top: auto; padding-top: 24px; text-align: right; font-size: 8pt; }
    #bill .signature-img { display: inline-block; max-width: 160px; max-height: 80px; margin-bottom: 5px; }
    #bill .sign-name { font-size: 9pt; color: #333; font-weight: 700; }

    @page { size: A4 portrait; margin: 0; }
    @media print {
      html, body { margin: 0; padding: 0; background: #fff !important; }
      body > *:not(#preview-wrap) { display: none !important; }
      #preview-wrap { display: block !important; margin: 0 !important; border-radius: 0 !important; box-shadow: none !important; background: #fff !important; }
      .no-print { display: none !important; }
      .a4-page { width: 210mm !important; min-height: 297mm !important; margin: 0 !important; box-shadow: none !important; page-break-after: always; zoom: 1 !important; transform: none !important; }
      #bill { padding: 12mm 14mm 14mm !important; min-height: 297mm !important; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="app-title">
      <h1>Shivam Furniture</h1>
      <p>Bill Generator</p>
    </div>
  </header>

  <div class="container">
    <div class="ios-section-header">Invoice Details</div>
    <div class="ios-group">
      <div class="ios-cell">
        <label class="ios-label">Serial No.</label>
        <input type="text" id="invoiceNo" class="ios-input" placeholder="e.g. SF 114" />
      </div>
      <div class="ios-cell">
        <label class="ios-label">Date</label>
        <input type="date" id="invoiceDate" class="ios-input" />
      </div>
    </div>

    <div class="ios-section-header">Buyer Details</div>
    <div class="ios-group">
      <div class="ios-cell">
        <label class="ios-label">Name</label>
        <input type="text" id="buyerName" class="ios-input" placeholder="Buyer Name" />
      </div>
      <div class="ios-cell">
        <label class="ios-label">Phone</label>
        <input type="tel" id="buyerPhone" class="ios-input" placeholder="10-digit mobile" />
      </div>
      <div class="ios-cell">
        <label class="ios-label">GSTIN</label>
        <input type="text" id="buyerGSTIN" class="ios-input" placeholder="Optional" style="text-transform:uppercase" />
      </div>
      <div class="ios-cell col">
        <label class="ios-label" style="margin-bottom:2px">Address</label>
        <textarea id="buyerAddr" class="ios-textarea" placeholder="Street, City, State, PIN" rows="2"></textarea>
      </div>
    </div>

    <div class="ios-section-header">Tax Configuration</div>
    <div class="ios-group">
      <div class="ios-cell">
        <label class="ios-label">Composite Bill</label>
        <label class="switch-wrap" id="compWrap">
          <input type="checkbox" id="compositeBill" onchange="toggleCompositeBill()" />
          <div class="switch-knob"></div>
        </label>
      </div>
      <div class="ios-cell">
        <label class="ios-label">Prices Include GST</label>
        <label class="switch-wrap" id="priceWrap">
          <input type="checkbox" id="priceInclTax" onchange="togglePriceIncl()" />
          <div class="switch-knob"></div>
        </label>
      </div>
      <div class="ios-cell" style="justify-content:center">
        <div class="segmented-control">
          <button class="segment-btn active" id="btn-igst" onclick="setTaxType('igst')">IGST</button>
          <button class="segment-btn" id="btn-cgst" onclick="setTaxType('cgst')">CGST + SGST</button>
        </div>
      </div>
      <div class="ios-cell">
        <label class="ios-label">GST Rate (%)</label>
        <input type="number" id="gstRate" class="ios-input" value="18" min="0" max="100" step=".01" style="max-width:80px" />
      </div>
    </div>
    <div class="ios-section-footer" id="tax-hint">Single IGST line on bill. Settings auto-adjust.</div>

    <div class="ios-section-header">Bank Details</div>
    <div class="ios-group">
      <div class="ios-cell">
        <label class="ios-label">Bank Name</label>
        <input type="text" id="bankName" class="ios-input" value="ICICI Bank" />
      </div>
      <div class="ios-cell">
        <label class="ios-label">Branch</label>
        <input type="text" id="bankBranch" class="ios-input" value="Jatia" />
      </div>
      <div class="ios-cell">
        <label class="ios-label">Account No</label>
        <input type="text" id="bankAcc" class="ios-input" value="416405000060" />
      </div>
      <div class="ios-cell">
        <label class="ios-label">IFSC Code</label>
        <input type="text" id="bankIFSC" class="ios-input" value="ICIC0004164" />
      </div>
    </div>

    <div class="ios-section-header">Signature Setup</div>
    <div class="ios-group">
      <div class="ios-cell">
        <input type="file" id="sigUploadInput" accept="image/*" onchange="handleSetupSignature(event)" style="font-size:14px; width:100%" />
      </div>
    </div>

    <div class="ios-section-header">Line Items</div>
    <div class="ios-group" style="padding-bottom: 8px;">
      <table class="items-table-ui">
        <thead><tr><th>#</th><th style="text-align:left">Item</th><th>HSN</th><th>Rate</th><th>Qty</th><th style="text-align:right">Total</th><th></th></tr></thead>
        <tbody id="itemsBody"></tbody>
      </table>
      <button class="btn btn-action" onclick="addRow()" style="background:transparent; margin-top:4px">＋ Add Item</button>
    </div>

    <!-- Actions -->
    <div style="padding: 0 16px; margin-top: 32px">
      <button class="btn btn-primary" onclick="generateBill()">Generate Bill Preview</button>
      <button class="btn btn-success" onclick="printBill()">Print / Save PDF</button>
    </div>
    
    <button class="btn btn-clear" onclick="clearAll()">Clear All Fields</button>

  </div> <!-- end container -->

  <div id="preview-wrap">
    <div class="no-print" style="padding:16px;background:#E5E5EA;text-align:center;font-weight:600;color:#000;border-bottom:1px solid #C7C7CC;">📄 A4 Preview</div>
    <div class="a4-page"><div id="bill"></div></div>
  </div>

  <script>
    /* ── Tax type state ── */
    let taxType = 'igst';

    function toggleCompositeBill() {
      const isComp = document.getElementById('compositeBill').checked;
      document.getElementById('gstRate').disabled = isComp;
      document.getElementById('priceInclTax').disabled = isComp;
      document.querySelectorAll('.segment-btn').forEach(btn => btn.style.pointerEvents = isComp ? 'none' : 'auto');
      document.querySelectorAll('.segment-btn').forEach(btn => btn.style.opacity = isComp ? '0.5' : '1');
      document.getElementById('gstRate').style.opacity = isComp ? '0.5' : '1';
      document.getElementById('priceInclTax').parentNode.style.opacity = isComp ? '0.5' : '1';
      
      const compWrap = document.getElementById('compWrap');
      if(isComp) { compWrap.classList.add('on-bg'); } else { compWrap.classList.remove('on-bg'); }

      recalcAll();
    }

    function togglePriceIncl() {
      const priceToggle = document.getElementById('priceInclTax');
      const wrap = document.getElementById('priceWrap');
      if(priceToggle.checked) { wrap.classList.add('on-bg'); } else { wrap.classList.remove('on-bg'); }
      recalcAll();
    }

    function setTaxType(t) {
      taxType = t;
      document.getElementById('btn-igst').classList.toggle('active', t === 'igst');
      document.getElementById('btn-cgst').classList.toggle('active', t === 'cgst');
      document.getElementById('tax-hint').textContent = t === 'igst' ? 'Single IGST line on bill.' : 'Tax split equally: CGST + SGST (half each).';
    }

    /* ── Indian number format ── */
    function fmtINR(n) {
      n = Math.round(n * 100) / 100;
      let [int, dec] = n.toFixed(2).split('.');
      let last3 = int.slice(-3);
      let rest = int.slice(0, -3);
      if (rest.length) last3 = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last3;
      return last3 + '.' + dec;
    }

    /* ── Amount in words ── */
    const _ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
    const _tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
    function numToWords(n) {
      n = Math.round(n);
      if (n === 0) return 'Zero';
      let w = '';
      if (n >= 10000000) { w += numToWords(Math.floor(n / 10000000)) + ' Crore '; n %= 10000000; }
      if (n >= 100000) { w += numToWords(Math.floor(n / 100000)) + ' Lakh '; n %= 100000; }
      if (n >= 1000) { w += numToWords(Math.floor(n / 1000)) + ' Thousand '; n %= 1000; }
      if (n >= 100) { w += numToWords(Math.floor(n / 100)) + ' Hundred '; n %= 100; }
      if (n > 0) {
        if (n < 20) w += _ones[n] + ' ';
        else { w += _tens[Math.floor(n / 10)] + ' '; if (n % 10) w += _ones[n % 10] + ' '; }
      }
      return w.trim();
    }
    function amountInWords(total) {
      let rupees = Math.floor(total);
      let paise = Math.round((total - rupees) * 100);
      let w = 'INR: ' + numToWords(rupees) + ' Rupee' + (rupees !== 1 ? 's' : '');
      if (paise > 0) w += ' and ' + numToWords(paise) + ' Paise';
      return w + ' Only';
    }

    /* ── Row management ── */
    let rowCount = 0;
    function addRow() {
      rowCount++;
      const id = rowCount;
      const tr = document.createElement('tr');
      tr.id = 'row-' + id;
      tr.innerHTML = `
        <td style="width:40px"><input type="number" value="${id}" min="1" class="ios-num" /></td>
        <td><input type="text" placeholder="Item description" class="ios-text" /></td>
        <td style="width:80px"><input type="text" placeholder="HSN" class="ios-text" style="text-align:center" /></td>
        <td style="width:100px"><input type="number" placeholder="0.00" min="0" step="0.01" class="rate-input ios-num" oninput="updateRowTotal(${id})" /></td>
        <td style="width:60px"><input type="number" value="1" min="1" class="qty-input ios-num" oninput="updateRowTotal(${id})" /></td>
        <td style="width:100px;text-align:right" class="row-total" id="rt-${id}">0.00</td>
        <td style="width:44px;text-align:center"><button class="btn-circular-delete" onclick="removeRow(${id})"><span>–</span></button></td>
      `;
      document.getElementById('itemsBody').appendChild(tr);
    }
    function removeRow(id) { document.getElementById('row-' + id)?.remove(); }
    
    function updateRowTotal(id) {
      const row = document.getElementById('row-' + id);
      if (!row) return;
      const rate = parseFloat(row.querySelector('.rate-input').value) || 0;
      const qty = parseFloat(row.querySelector('.qty-input').value) || 0;
      const isComp = document.getElementById('compositeBill') && document.getElementById('compositeBill').checked;
      const inclTax = document.getElementById('priceInclTax').checked && !isComp;
      const gst = isComp ? 0 : (parseFloat(document.getElementById('gstRate').value) || 0);
      const base = inclTax ? rate / (1 + gst / 100) : rate;
      document.getElementById('rt-' + id).textContent = fmtINR(base * qty);
    }
    function recalcAll() { document.querySelectorAll('#itemsBody tr').forEach(tr => updateRowTotal(tr.id.replace('row-', ''))); }

    /* ── Generate Bill ── */
    function generateBill() {
      const isComp = document.getElementById('compositeBill') && document.getElementById('compositeBill').checked;
      const inclTax = document.getElementById('priceInclTax').checked && !isComp;
      const gst = isComp ? 0 : (parseFloat(document.getElementById('gstRate').value) || 0);
      const rows = document.querySelectorAll('#itemsBody tr');
      if (!rows.length) { alert('Please add at least one item.'); return; }

      let items = [], amtBefore = 0;
      rows.forEach((tr, i) => {
        const inp = tr.querySelectorAll('input');
        const slNo = inp[0].value || (i + 1);
        const name = inp[1].value || '—';
        const hsn = inp[2].value || '';
        const rate = parseFloat(inp[3].value) || 0;
        const qty = parseFloat(inp[4].value) || 1;
        const base = inclTax ? rate / (1 + gst / 100) : rate;
        const total = base * qty;
        amtBefore += total;
        items.push({ slNo, name, hsn, rate: base, qty, total });
      });

      const gstAmt = amtBefore * gst / 100;
      const totalAmt = amtBefore + gstAmt;
      const halfGst = gstAmt / 2;
      const halfPct = gst / 2;

      const buyerName = document.getElementById('buyerName').value;
      const buyerAddr = document.getElementById('buyerAddr').value;
      const buyerPhone = document.getElementById('buyerPhone').value;
      const buyerGSTIN = document.getElementById('buyerGSTIN').value;
      const invoiceNo = document.getElementById('invoiceNo').value || 'SF —';
      const invoiceDate = formatDate(document.getElementById('invoiceDate').value);
      const bkName = document.getElementById('bankName').value;
      const bkBranch = document.getElementById('bankBranch').value;
      const bkAcc = document.getElementById('bankAcc').value;
      const bkIFSC = document.getElementById('bankIFSC').value;

      const rowsHtml = items.map(it => `
        <tr>
          <td>${String(it.slNo).padStart(2, '0')}</td>
          <td class="item-name">${esc(it.name)}</td>
          <td>${esc(it.hsn)}</td>
          <td>${fmtINR(it.rate)}</td>
          <td>${it.qty}</td>
          <td>${fmtINR(it.total)}</td>
        </tr>
      `).join('');

      let buyerHtml = `<span class="buyer-label">BUYER:</span><br>
        <span class="buyer-name">${esc(buyerName)}</span>${buyerAddr ? '<br>' + esc(buyerAddr).replace(/\n/g, '<br>') : ''}
        ${buyerPhone ? '<br><br>Ph. No. ' + esc(buyerPhone) : ''}
        ${buyerGSTIN ? '<br>GSTIN: ' + esc(buyerGSTIN).toUpperCase() : ''}`;

      let taxRowsHtml = '';
      if (isComp) {
        taxRowsHtml = `
          <div class="summary-row"><div class="add-block"><div class="add-head">ADD: 0% GST</div></div><span class="amt">0.00</span></div>`;
      } else if (taxType === 'igst') {
        taxRowsHtml = `
          <div class="summary-row"><div class="add-block"><div class="add-head">ADD:</div><div>${gst}% IGST</div></div><span class="amt">${fmtINR(gstAmt)}</span></div>`;
      } else {
        taxRowsHtml = `
          <div class="summary-row"><div class="add-block"><div class="add-head">ADD:</div><div>CGST @ ${halfPct}%</div></div><span class="amt">${fmtINR(halfGst)}</span></div>
          <div class="summary-row"><div class="add-block" style="padding-left:4px"><div>SGST @ ${halfPct}%</div></div><span class="amt">${fmtINR(halfGst)}</span></div>`;
      }

      document.getElementById('bill').innerHTML = `
        <div class="invoice-title">${isComp ? 'BILL OF SUPPLY' : 'INVOICE'}</div>
        <div class="bill-header">
          <div class="shop-name">Shivam Furniture</div>
          <div class="shop-addr">Narkashur, Kahilipara, Opp Bharat Petroleum</div>
          <div class="shop-addr">Guwahati - 781019</div>
          <div class="shop-phone">Phone:- 9957184205</div>
          <div class="shop-gstin"><strong>GSTIN - 18ALVPD2044B1ZD</strong></div>
        </div>
        <div class="meta-row"><span><strong>SERIAL NO. ${esc(invoiceNo)}</strong></span></div>
        ${isComp ? `<div class="composite-notice">Composition Dealer: Not eligible to collect taxes on supplies.</div>` : ''}
        <div class="buyer-box">
          <div class="buyer-left">${buyerHtml}</div>
          <div class="buyer-date"><strong>DATE:</strong> ${invoiceDate}</div>
        </div>
        <table class="items">
          <thead><tr><th style="width:42px">SL NO</th><th>ITEM</th><th style="width:75px">HSN CODE</th><th style="width:82px">RATE</th><th style="width:70px">QUANTITY</th><th style="width:95px">TOTAL AMOUNT</th></tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
        <div class="summary-row bold-row"><span>AMOUNT BEFORE TAX</span><span class="amt">${fmtINR(amtBefore)}</span></div>
        ${taxRowsHtml}
        <div class="summary-row total-row"><span>TOTAL AMOUNT AFTER TAX</span><span class="amt">${fmtINR(totalAmt)}</span></div>
        <div class="words-section"><div class="words-lbl">Amount Chargeable (in words)</div><div class="words-val">${amountInWords(totalAmt)}</div></div>
        <div class="bill-body">
          <div class="bank-section"><div class="bank-title">Company's Bank Details</div><div class="bank-grid">
            <span class="bank-key">Bank Name</span><span>${esc(bkName)}</span>
            <span class="bank-key">Branch Name</span><span>${esc(bkBranch)}</span>
            <span class="bank-key">A/C Number</span><span>${esc(bkAcc)}</span>
            <span class="bank-key">IFSC Code</span><span>${esc(bkIFSC)}</span>
          </div></div>
          <div class="sign-section">
            <img src="${localStorage.getItem('shivam_sig') || 'signature.png'}" alt="Signature" class="signature-img" onerror="this.style.display='none'" />
            <div class="sign-name">(Shivam Furniture)</div>
          </div>
        </div>
      `;
      const wrap = document.getElementById('preview-wrap');
      wrap.classList.add('visible');
      wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function printBill() {
      if (!document.getElementById('preview-wrap').classList.contains('visible')) {
        generateBill();
        setTimeout(() => window.print(), 450);
      } else { window.print(); }
    }

    function clearAll() {
      if (!confirm('Clear all fields and items?')) return;
      ['invoiceNo', 'invoiceDate', 'buyerName', 'buyerAddr', 'buyerPhone', 'buyerGSTIN'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
      document.getElementById('itemsBody').innerHTML = ''; rowCount = 0;
      document.getElementById('preview-wrap').classList.remove('visible');
      document.getElementById('invoiceDate').valueAsDate = new Date();
    }

    function handleSetupSignature(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (evt) {
        localStorage.setItem('shivam_sig', evt.target.result);
        alert('Signature successfully saved!');
        if (document.getElementById('preview-wrap').classList.contains('visible')) { generateBill(); }
      };
      reader.readAsDataURL(file);
    }

    function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function formatDate(d) {
      if (!d) return '—';
      const [y, m, day] = d.split('-'); return `${day}-${m}-${y.slice(2)}`;
    }

    document.getElementById('invoiceDate').valueAsDate = new Date();
    addRow();
    document.getElementById('gstRate').addEventListener('input', recalcAll);
  </script>
</body>
</html>
